name: Generate 3D contribution calendar

# Schedule + manual only. Pushes here are made with GITHUB_TOKEN, which by
# design does not re-trigger workflows, but keeping `push` off the triggers
# makes the no-loop guarantee explicit.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & push
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add -A .
          git diff --staged --quiet || git commit -m "chore: regenerate 3D contribution calendar"
          git push
